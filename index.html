<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #252530;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --emerald: #34d399;
    --emerald-bg: rgba(52,211,153,0.12);
    --emerald-border: rgba(52,211,153,0.3);
    --amber: #fbbf24;
    --amber-bg: rgba(251,191,36,0.12);
    --red: #f87171;
    --blue: #60a5fa;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .container { width: 100%; max-width: 640px; padding: 20px 16px; }

  .header { text-align: center; padding: 32px 0 16px; }
  .header h1 { font-size: 3rem; font-weight: 900; letter-spacing: -2px; background: linear-gradient(135deg, var(--emerald), #6ee7b7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .header p { color: var(--text-dim); margin-top: 4px; font-size: 0.95rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .card-title {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-bottom: 12px;
    font-weight: 600;
  }

  .option-grid { display: grid; gap: 8px; }
  .option-grid.cols2 { grid-template-columns: 1fr 1fr; }
  .option-grid.cols3 { grid-template-columns: 1fr 1fr 1fr; }
  .option-grid.cols5 { grid-template-columns: repeat(5, 1fr); }

  .option-btn {
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 12px 10px;
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    text-align: center;
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .option-btn:hover { border-color: var(--text-dim); background: #222230; }
  .option-btn.selected {
    background: var(--emerald-bg);
    border-color: var(--emerald);
    color: var(--emerald);
    box-shadow: 0 0 12px rgba(52,211,153,0.2);
  }
  .option-btn .sub { font-size: 0.7rem; color: var(--text-dim); font-weight: 400; }
  .option-btn.selected .sub { color: var(--emerald); opacity: 0.7; }

  .formation-preview {
    background: #0d5e36;
    border-radius: 12px;
    padding: 20px;
    margin-top: 12px;
    position: relative;
    min-height: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .pitch { position: relative; width: 100%; max-width: 340px; height: 220px; }
  .pitch-dot {
    position: absolute;
    width: 28px; height: 28px;
    background: rgba(255,255,255,0.9);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.55rem; font-weight: 700; color: #0a5e2e;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }
  .pitch-lines {
    position: absolute; inset: 0;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 4px;
  }
  .pitch-half { position: absolute; top:0; bottom:0; left:50%; border-left: 2px dashed rgba(255,255,255,0.15); }
  .pitch-center { position: absolute; top:50%; left:50%; width:40px; height:40px; border: 2px solid rgba(255,255,255,0.2); border-radius:50%; transform: translate(-50%,-50%); }

  .desc-text {
    color: rgba(255,255,255,0.7);
    font-size: 0.8rem;
    text-align: center;
    margin-top: 12px;
    font-style: italic;
  }

  .start-btn {
    width: 100%; padding: 16px;
    background: linear-gradient(135deg, #059669, #10b981);
    border: none; border-radius: 14px;
    color: white;
    font-size: 1.1rem; font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }
  .start-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(16,185,129,0.3); }
  .start-btn:active { transform: translateY(0); }

  .draft-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; margin-bottom: 16px;
  }
  .draft-header .title { font-size: 0.85rem; color: var(--text-dim); }
  .draft-header .score { font-size: 1.3rem; font-weight: 700; color: var(--emerald); }

  .xi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .xi-slot {
    background: var(--surface2);
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 10px 8px;
    text-align: center;
    min-height: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 0.75rem;
  }
  .xi-slot:hover { border-color: var(--text-dim); }
  .xi-slot.filled {
    border-style: solid;
    border-color: var(--emerald-border);
    background: var(--emerald-bg);
  }
  .xi-slot .pos { font-weight: 700; color: var(--emerald); font-size: 0.7rem; }
  .xi-slot .player-name { font-weight: 600; font-size: 0.8rem; margin-top: 2px; }
  .xi-slot .player-club { font-size: 0.65rem; color: var(--text-dim); }
  .xi-slot .player-rating { font-size: 1rem; font-weight: 800; color: var(--amber); margin-top: 2px; }
  .xi-slot .empty-pos { color: var(--text-dim); font-size: 0.8rem; }

  .spin-area { text-align: center; }
  .club-display {
    background: var(--surface2);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
    animation: popIn 0.3s ease-out;
  }
  @keyframes popIn {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .club-name { font-size: 1.4rem; font-weight: 800; }
  .club-hint { font-size: 0.8rem; color: var(--text-dim); margin-top: 4px; }

  .spin-btn {
    padding: 14px 40px;
    background: var(--amber);
    color: #000;
    border: none; border-radius: 12px;
    font-size: 1rem; font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.5px;
  }
  .spin-btn:hover { transform: scale(1.03); box-shadow: 0 4px 16px rgba(251,191,36,0.3); }
  .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .player-list {
    display: grid;
    gap: 6px;
    max-height: 300px;
    overflow-y: auto;
  }
  .player-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    cursor: pointer;
    transition: all 0.1s;
  }
  .player-row:hover { border-color: var(--emerald-border); background: var(--emerald-bg); }
  .player-row.selected { border-color: var(--emerald); background: var(--emerald-bg); }
  .player-row .info { display: flex; flex-direction: column; gap: 2px; }
  .player-row .name { font-weight: 600; font-size: 0.9rem; }
  .player-row .details { font-size: 0.72rem; color: var(--text-dim); }
  .player-row .rating {
    font-size: 1.15rem; font-weight: 800; color: var(--amber);
    background: rgba(251,191,36,0.1);
    border-radius: 8px;
    padding: 4px 10px;
    min-width: 42px;
    text-align: center;
  }

  .position-picker {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 12px; justify-content: center;
  }
  .pos-pill {
    padding: 6px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.78rem; font-weight: 600;
    cursor: pointer;
    transition: all 0.1s;
    color: var(--text);
  }
  .pos-pill:hover { border-color: var(--text-dim); }
  .pos-pill.selected { background: var(--emerald-bg); border-color: var(--emerald); color: var(--emerald); }
  .pos-pill.used { opacity: 0.3; cursor: not-allowed; }

  .confirm-btn {
    width: 100%;
    padding: 12px;
    background: var(--emerald);
    color: #000;
    border: none; border-radius: 12px;
    font-size: 0.95rem; font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    margin-top: 12px;
  }
  .confirm-btn:hover { filter: brightness(1.1); }
  .confirm-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .reroll-btn {
    padding: 8px 20px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-dim);
    font-size: 0.8rem;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.15s;
  }
  .reroll-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .reroll-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .results { text-align: center; }
  .results .final-score {
    font-size: 4rem; font-weight: 900;
    color: var(--emerald);
    letter-spacing: -2px;
    line-height: 1;
  }
  .results .final-label { color: var(--text-dim); font-size: 0.9rem; margin-top: 4px; }
  .results .final-xi { margin-top: 20px; text-align: left; }
  .results .final-player {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .results .final-player .fp-pos { color: var(--emerald); font-weight: 700; width: 30px; }
  .results .final-player .fp-name { flex: 1; font-weight: 600; }
  .results .final-player .fp-club { color: var(--text-dim); font-size: 0.75rem; margin-right: 12px; }
  .results .final-player .fp-rating { font-weight: 800; color: var(--amber); }

  .play-again {
    width: 100%; padding: 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 0.95rem; font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
    transition: all 0.15s;
  }
  .play-again:hover { background: #222230; border-color: var(--text-dim); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--emerald-border);
    padding: 10px 20px; border-radius: 10px;
    font-size: 0.85rem; color: var(--emerald);
    z-index: 100;
    animation: toastIn 0.3s ease-out;
    pointer-events: none;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(10px); }
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
</style>

var FORMATIONS = {
  "4-3-3":{
    positions:["GK","RB","CB","CB","LB","CM","CM","CM","RW","ST","LW"],
    desc:"Attacking with width. Three forwards create constant threat."
  },
  "4-4-2":{
    positions:["GK","RB","CB","CB","LB","RM","CM","CM","LM","ST","ST"],
    desc:"Classic English setup. Two banks of four, strike partnership."
  },
  "4-5-1":{
    positions:["GK","RB","CB","CB","LB","RM","CM","CAM","CM","LM","ST"],
    desc:"Defensive solidity. Pack the midfield, lone striker up top."
  },
  "3-5-2":{
    positions:["GK","CB","CB","CB","RM","CM","CDM","CM","LM","ST","ST"],
    desc:"Wing-back system. Three at the back with overload in midfield."
  },
  "5-4-1":{
    positions:["GK","RWB","CB","CB","CB","LWB","CM","CM","RM","LM","ST"],
    desc:"Park the bus. Five defenders, counter-attacking setup."
  }
};

var DIFFICULTIES = [
  {id:"easy",label:"Easy",sub:"1 reroll available",rerolls:1},
  {id:"normal",label:"Normal",sub:"No rerolls",rerolls:0},
  {id:"hard",label:"Hard",sub:"No rerolls · ratings hidden",rerolls:0,blind:true}
];

var DRAFT_MODES = [
  {id:"squad",label:"Squad First",sub:"Spin a club, pick any player, choose their position"},
  {id:"position",label:"Position First",sub:"Pick a slot, then spin for a club to fill it"}
];

var RATING_MODES = [
  {id:"career",label:"Career Seasons",sub:"Players rated as they were that exact season"},
  {id:"prime",label:"Prime Mode",sub:"Every player at their career-best rating"}
];

// Game state
var state = {
  screen:"setup",
  formation:"4-3-3",
  difficulty:"easy",
  showRatings:true,
  draftMode:"squad",
  ratingMode:"career",
  xi:{},
  currentClub:null,
  currentClubPlayers:[],
  selectedPlayer:null,
  selectedPosition:null,
  rerollsLeft:1,
  filledCount:0
};

// Helpers
function getRating(p){
  return state.ratingMode==="prime" ? (p.prime||p.rating) : p.rating;
}
function getClubPlayers(club){
  return PLAYERS.filter(function(p){return p.club===club;});
}
function getEmptyPositions(){
  var positions = FORMATIONS[state.formation].positions;
  var unique = [];
  var seen = {};
  for(var i=0;i<positions.length;i++){
    if(!seen[positions[i]]){seen[positions[i]]=true;unique.push(positions[i]);}
  }
  var filled = {};
  var keys = Object.keys(state.xi);
  for(var i=0;i<keys.length;i++){
    var e = state.xi[keys[i]];
    if(e) filled[e.position] = (filled[e.position]||0)+1;
  }
  var counts = {};
  for(var i=0;i<positions.length;i++){
    counts[positions[i]] = (counts[positions[i]]||0)+1;
  }
  return unique.filter(function(pos){
    return (filled[pos]||0) < counts[pos];
  });
}
function randomClub(){
  var clubs = Object.keys(CLUBS);
  return clubs[Math.floor(Math.random()*clubs.length)];
}
function getScore(){
  var positions = FORMATIONS[state.formation].positions;
  var total = 0;
  for(var i=0;i<positions.length;i++){
    var sid = positions[i]+"_"+i;
    var entry = state.xi[sid];
    if(entry) total += getRating(entry.player);
  }
  return Math.round(total/positions.length);
}
function toast(msg){
  var el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.getElementById("toast-container").appendChild(el);
  setTimeout(function(){el.remove();},2000);
}

// Formation dots
function getFormationDots(positions){
  var result = [{label:"GK",x:50,y:92}];
  var outfield = positions.slice(1);
  var defRows = ["RB","CB","LB","RWB","LWB"];
  var midRows = ["CM","CDM","CAM","RM","LM"];
  var fwdRows = ["ST","RW","LW"];
  var rows = [[],[],[]];
  for(var i=0;i<outfield.length;i++){
    var p = outfield[i];
    if(defRows.indexOf(p)>=0) rows[0].push(p);
    else if(midRows.indexOf(p)>=0) rows[1].push(p);
    else rows[2].push(p);
  }
  var rowYs = [60,38,16];
  for(var i=0;i<3;i++){
    var r = rows[i];
    if(r.length===0) continue;
    var y = rowYs[i];
    var spacing = 80/(r.length+1);
    for(var j=0;j<r.length;j++){
      result.push({label:r[j],x:10+spacing*(j+1),y:y});
    }
  }
  return result;
}

// Render
function render(){
  var app = document.getElementById("app");
  if(state.screen==="setup") app.innerHTML = renderSetup();
  else if(state.screen==="drafting") app.innerHTML = renderDraft();
  else if(state.screen==="results") app.innerHTML = renderResults();
  bindEvents();
}

function renderSetup(){
  var f = state.formation;
  var d = state.difficulty;
  var sr = state.showRatings;
  var dm = state.draftMode;
  var rm = state.ratingMode;
  var pos = FORMATIONS[f].positions;

  var formationBtns = Object.keys(FORMATIONS).map(function(k){
    return '<button class="option-btn'+(k===f?' selected':'')+'" data-action="set-formation" data-value="'+k+'">'+k+'</button>';
  }).join("");

  var diffBtns = DIFFICULTIES.map(function(dd){
    return '<button class="option-btn'+(dd.id===d?' selected':'')+'" data-action="set-difficulty" data-value="'+dd.id+'">'+dd.label+'<span class="sub">'+dd.sub+'</span></button>';
  }).join("");

  var ratingToggle = '<button class="option-btn'+(sr?' selected':'')+'" data-action="set-ratings" data-value="on">On<span class="sub">Player overalls visible</span></button><button class="option-btn'+(!sr?' selected':'')+'" data-action="set-ratings" data-value="off">Off<span class="sub">Blind mode — trust your gut</span></button>';

  var draftModeBtns = DRAFT_MODES.map(function(m){
    return '<button class="option-btn'+(m.id===dm?' selected':'')+'" data-action="set-draft-mode" data-value="'+m.id+'">'+m.label+'<span class="sub">'+m.sub+'</span></button>';
  }).join("");

  var ratingModeBtns = RATING_MODES.map(function(m){
    return '<button class="option-btn'+(m.id===rm?' selected':'')+'" data-action="set-rating-mode" data-value="'+m.id+'">'+m.label+'<span class="sub">'+m.sub+'</span></button>';
  }).join("");

  var dots = getFormationDots(pos).map(function(d){
    return '<div class="pitch-dot" style="left:'+d.x+'%;top:'+d.y+'%">'+d.label+'</div>';
  }).join("");

  return '<div class="header"><h1>38-0</h1><p>Draft your greatest Premier League XI</p></div>'+
    '<div class="card"><div class="card-title">FORMATION</div><div class="option-grid cols5">'+formationBtns+'</div>'+
    '<div class="formation-preview"><div class="pitch"><div class="pitch-lines"></div><div class="pitch-half"></div><div class="pitch-center"></div>'+dots+'</div><div class="desc-text">'+FORMATIONS[f].desc+'</div></div></div>'+
    '<div class="card"><div class="card-title">DIFFICULTY</div><div class="option-grid cols3">'+diffBtns+'</div></div>'+
    '<div class="card"><div class="card-title">SHOW RATINGS</div><div class="option-grid cols2">'+ratingToggle+'</div></div>'+
    '<div class="card"><div class="card-title">DRAFT MODE</div><div class="option-grid cols2">'+draftModeBtns+'</div></div>'+
    '<div class="card"><div class="card-title">PLAYER RATINGS</div><div class="option-grid cols2">'+ratingModeBtns+'</div></div>'+
    '<button class="start-btn" data-action="start-draft">Start Draft →</button>';
}

function renderDraft(){
  var slots = FORMATIONS[state.formation].positions;
  var emptyPositions = getEmptyPositions();
  var isPositionFirst = state.draftMode==="position";
  var diff = null;
  for(var i=0;i<DIFFICULTIES.length;i++){if(DIFFICULTIES[i].id===state.difficulty){diff=DIFFICULTIES[i];break;}}
  var blind = diff && diff.blind;

  var xiHtml = "";
  for(var i=0;i<slots.length;i++){
    var slotId = slots[i]+"_"+i;
    var entry = state.xi[slotId];
    if(entry){
      var r = blind ? "?" : getRating(entry.player);
      xiHtml += '<div class="xi-slot filled" data-slot="'+slotId+'"><div class="pos">'+slots[i]+'</div><div class="player-name">'+entry.player.name+'</div><div class="player-club">'+entry.player.club+'</div><div class="player-rating">'+r+'</div></div>';
    }else{
      xiHtml += '<div class="xi-slot" data-slot="'+slotId+'"><div class="pos">'+slots[i]+'</div><div class="empty-pos">Empty</div></div>';
    }
  }

  var spinAreaHtml = "";
  if(isPositionFirst && !state.selectedPosition && !state.currentClub){
    spinAreaHtml = '<div class="card"><div class="card-title">PICK A POSITION</div><div class="position-picker">'+
      emptyPositions.map(function(p){return '<button class="pos-pill" data-action="pick-position" data-pos="'+p+'">'+p+'</button>';}).join("")+
      '</div></div>';
  }else if(!state.currentClub){
    var posLabel = isPositionFirst ? " for "+state.selectedPosition : "";
    spinAreaHtml = '<div class="spin-area"><p style="color:var(--text-dim);margin-bottom:12px;">Spin the wheel to get a club'+posLabel+'</p><button class="spin-btn" data-action="spin">🎰 SPIN</button></div>';
  }else{
    var players = state.currentClubPlayers;
    var playerListHtml = players.map(function(p,idx){
      var r = getRating(p);
      var ratingDisplay = state.showRatings ? r : "?";
      var sel = state.selectedPlayer && state.selectedPlayer.name===p.name;
      var posStr = p.pos.join(", ");
      return '<div class="player-row'+(sel?' selected':'')+'" data-action="select-player" data-idx="'+idx+'"><div class="info"><div class="name">'+p.name+'</div><div class="details">'+posStr+'</div></div><div class="rating">'+ratingDisplay+'</div></div>';
    }).join("");

    var posPickerHtml = "";
    if(state.selectedPlayer && state.draftMode==="squad"){
      var validPositions = emptyPositions.filter(function(pos){return state.selectedPlayer.pos.indexOf(pos)>=0;});
      posPickerHtml = '<div class="card-title" style="margin-top:12px;">PICK POSITION</div><div class="position-picker">'+
        validPositions.map(function(p){return '<button class="pos-pill'+(state.selectedPosition===p?' selected':'')+'" data-action="pick-position" data-pos="'+p+'">'+p+'</button>';}).join("")+
        '</div><button class="confirm-btn" data-action="confirm-pick"'+(state.selectedPosition?'':' disabled')+'>Confirm Pick</button>';
    }else if(state.selectedPlayer && state.draftMode==="position"){
      posPickerHtml = '<button class="confirm-btn" data-action="confirm-pick">Confirm '+state.selectedPlayer.name+' at '+state.selectedPosition+'</button>';
    }

    spinAreaHtml = '<div class="club-display"><div class="club-name">'+state.currentClub+'</div><div class="club-hint">'+players.length+' players available</div></div>'+
      '<div class="player-list">'+playerListHtml+'</div>'+posPickerHtml+
      (state.rerollsLeft>0 ? '<button class="reroll-btn" data-action="reroll">🔄 Reroll ('+state.rerollsLeft+' left)</button>' : '');
  }

  return '<div class="draft-header"><div><button style="background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:0.85rem;" data-action="back-to-setup">← Back</button><span class="title"> · '+state.filledCount+'/11 filled</span></div><div class="score">'+getScore()+' OVR</div></div>'+
    '<div class="card"><div class="card-title">YOUR XI · '+FORMATIONS[state.formation].desc.split(".")[0]+'</div><div class="xi-grid">'+xiHtml+'</div></div>'+spinAreaHtml;
}

function renderResults(){
  var slots = FORMATIONS[state.formation].positions;
  var score = getScore();
  var diff = null;
  for(var i=0;i<DIFFICULTIES.length;i++){if(DIFFICULTIES[i].id===state.difficulty){diff=DIFFICULTIES[i];break;}}
  var blind = diff && diff.blind;

  var xiList = "";
  for(var i=0;i<slots.length;i++){
    var slotId = slots[i]+"_"+i;
    var entry = state.xi[slotId];
    if(entry){
      var r = blind ? "?" : getRating(entry.player);
      xiList += '<div class="final-player"><span class="fp-pos">'+slots[i]+'</span><span class="fp-name">'+entry.player.name+'</span><span class="fp-club">'+entry.player.club+'</span><span class="fp-rating">'+r+'</span></div>';
    }
  }

  var verdict = "";
  if(score>=90) verdict="🏆 WORLD CLASS XI — Invincibles worthy!";
  else if(score>=87) verdict="🔥 Elite squad. Title challengers for sure.";
  else if(score>=84) verdict="👍 Solid team. European spots incoming.";
  else if(score>=80) verdict="😐 Mid-table. Decent but not scary.";
  else verdict="💀 Relegation fodder. Try again!";

  return '<div class="header"><h1>38-0</h1><p>Your Final XI</p></div>'+
    '<div class="card results"><div class="final-score">'+score+'</div><div class="final-label">OVERALL RATING</div><p style="color:var(--text-dim);margin-top:12px;">'+verdict+'</p><div class="final-xi">'+xiList+'</div></div>'+
    '<button class="play-again" data-action="play-again">Play Again</button>';
}

function bindEvents(){
  var els = document.querySelectorAll("[data-action]");
  for(var i=0;i<els.length;i++){
    els[i].onclick = (function(el){
      return function(e){
        handleAction(el.dataset.action, el.dataset);
      };
    })(els[i]);
  }
}

function handleAction(action, data){
  switch(action){
    case "set-formation":
      state.formation = data.value; render(); break;
    case "set-difficulty":
      state.difficulty = data.value;
      var dd = null;
      for(var i=0;i<DIFFICULTIES.length;i++){if(DIFFICULTIES[i].id===data.value){dd=DIFFICULTIES[i];break;}}
      state.rerollsLeft = dd ? dd.rerolls : 0;
      if(dd && dd.blind) state.showRatings = false;
      render(); break;
    case "set-ratings":
      state.showRatings = data.value==="on"; render(); break;
    case "set-draft-mode":
      state.draftMode = data.value; render(); break;
    case "set-rating-mode":
      state.ratingMode = data.value; render(); break;
    case "start-draft":
      state.screen = "drafting";
      state.xi = {};
      state.filledCount = 0;
      state.currentClub = null;
      state.currentClubPlayers = [];
      state.selectedPlayer = null;
      state.selectedPosition = null;
      var ddiff = null;
      for(var i=0;i<DIFFICULTIES.length;i++){if(DIFFICULTIES[i].id===state.difficulty){ddiff=DIFFICULTIES[i];break;}}
      state.rerollsLeft = ddiff ? ddiff.rerolls : 0;
      render(); break;
    case "back-to-setup":
      state.screen = "setup"; render(); break;
    case "pick-position":
      state.selectedPosition = data.pos;
      if(state.draftMode==="position"){
        state.currentClub = randomClub();
        state.currentClubPlayers = getClubPlayers(state.currentClub);
        state.selectedPlayer = null;
      }
      render(); break;
    case "spin":
      state.currentClub = randomClub();
      state.currentClubPlayers = getClubPlayers(state.currentClub);
      state.selectedPlayer = null;
      if(state.draftMode==="squad") state.selectedPosition = null;
      render(); break;
    case "reroll":
      if(state.rerollsLeft>0){
        state.rerollsLeft--;
        state.currentClub = randomClub();
        state.currentClubPlayers = getClubPlayers(state.currentClub);
        state.selectedPlayer = null;
        if(state.draftMode==="squad") state.selectedPosition = null;
        render();
      }
      break;
    case "select-player":
      var idx = parseInt(data.idx);
      state.selectedPlayer = state.currentClubPlayers[idx];
      if(state.draftMode==="position" && state.selectedPosition){
        if(state.selectedPlayer.pos.indexOf(state.selectedPosition)<0){
          toast("This player can't play that position!");
          state.selectedPlayer = null;
        }
      }
      render(); break;
    case "confirm-pick":
      if(!state.selectedPlayer || !state.selectedPosition) return;
      if(state.selectedPlayer.pos.indexOf(state.selectedPosition)<0){
        toast("This player can't play that position!"); return;
      }
      var slots = FORMATIONS[state.formation].positions;
      var assigned = false;
      for(var i=0;i<slots.length;i++){
        var sid = slots[i]+"_"+i;
        if(slots[i]===state.selectedPosition && !state.xi[sid]){
          state.xi[sid] = {player:state.selectedPlayer, position:state.selectedPosition};
          assigned = true; break;
        }
      }
      if(!assigned){toast("No available slot for that position!"); return;}
      state.filledCount++;
      state.currentClub = null;
      state.currentClubPlayers = [];
      state.selectedPlayer = null;
      state.selectedPosition = null;
      if(state.filledCount>=11) state.screen = "results";
      render(); break;
    case "play-again":
      state.screen = "setup";
      state.xi = {};
      state.filledCount = 0;
      render(); break;
  }
}

render();
</script>
