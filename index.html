<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>38-0 | Build The Greatest Premier League XI</title>
<style>
:root {
  --bg: #f8f9fa; --surface: #fff; --surface2: #e9ecef;
  --border: #dee2e6; --text: #212529; --text-dim: #6c757d;
  --emerald: #059669; --emerald-bg: #d1fae5; --emerald-border: #6ee7b7;
  --amber: #d97706; --amber-bg: #fef3c7;
  --pitch: #2d8a4e; --pitch-line: rgba(255,255,255,0.4);
  --header-bg: #fff; --header-border: #e5e7eb;
}
.dark {
  --bg: #0a0a0f; --surface: #111118; --surface2: #1a1a24;
  --border: #252530; --text: #e2e8f0; --text-dim: #94a3b8;
  --emerald: #34d399; --emerald-bg: rgba(52,211,153,0.12); --emerald-border: rgba(52,211,153,0.3);
  --amber: #fbbf24; --amber-bg: rgba(251,191,36,0.12);
  --pitch: #0d5e36; --pitch-line: rgba(255,255,255,0.25);
  --header-bg: #0d0d14; --header-border: #1f1f2e;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
}

/* Header */
.header {
  background: var(--header-bg);
  border-bottom: 1px solid var(--header-border);
  padding: 10px 20px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  position: sticky; top: 0; z-index: 10;
}
.header-brand {
  font-weight: 900; font-size: 1.1rem; letter-spacing: -1px;
  color: var(--emerald); text-decoration: none; white-space: nowrap;
  display: flex; align-items: center; gap: 6px;
}
.header-brand .sub { font-weight: 400; font-size: 0.65rem; color: var(--text-dim); letter-spacing: 1px; }
.header-info { font-size: 0.8rem; color: var(--text-dim); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.header-info span { white-space: nowrap; }
.header-info .val { color: var(--text); font-weight: 600; }
.theme-btn, .stream-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text); padding: 5px 12px; border-radius: 6px;
  font-size: 0.75rem; cursor: pointer; font-weight: 600;
  transition: all 0.15s;
}
.theme-btn:hover, .stream-btn:hover { border-color: var(--text-dim); }

/* Main layout */
.main-layout {
  display: flex; gap: 0; min-height: calc(100vh - 52px);
}
.panel-left {
  width: 340px; min-width: 280px;
  border-right: 1px solid var(--border);
  padding: 16px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 12px;
}
.panel-center {
  flex: 1; padding: 16px;
  display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start;
  min-width: 200px;
}
.panel-right {
  width: 280px; min-width: 240px;
  border-left: 1px solid var(--border);
  padding: 16px; overflow-y: auto;
}

/* Settings bar */
.settings-bar {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  align-items: center;
}
.settings-label {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-dim); font-weight: 700; margin-right: 4px;
}
.settings-group { display: flex; gap: 4px; flex-wrap: wrap; }
.setting-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-dim); padding: 4px 10px; border-radius: 6px;
  font-size: 0.72rem; cursor: pointer; font-weight: 500;
  transition: all 0.12s; white-space: nowrap;
}
.setting-btn:hover { color: var(--text); border-color: var(--text-dim); }
.setting-btn.active {
  background: var(--emerald-bg); border-color: var(--emerald);
  color: var(--emerald); font-weight: 600;
}
.settings-divider { width: 1px; background: var(--border); margin: 0 6px; align-self: stretch; }

/* Roll area */
.roll-area { text-align: center; }
.drawn-club {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; margin-bottom: 10px;
  animation: popIn 0.25s ease-out;
}
@keyframes popIn { from { transform:scale(0.95); opacity:0; } to { transform:scale(1); opacity:1; } }
.drawn-club .club-icon { font-size: 2rem; }
.drawn-club .club-name { font-size: 1.15rem; font-weight: 800; margin-top: 4px; }
.drawn-club .club-era { font-size: 0.75rem; color: var(--text-dim); }
.reroll-row {
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
  margin-bottom: 10px;
}
.reroll-row .reroll-label {
  font-size: 0.7rem; color: var(--text-dim); width: 100%; text-align: center;
  text-transform: uppercase; letter-spacing: 1px;
}
.roll-btn {
  background: var(--amber); color: #000;
  border: none; border-radius: 10px;
  padding: 12px 28px; font-size: 0.95rem; font-weight: 700;
  cursor: pointer; transition: all 0.15s;
  letter-spacing: 0.5px;
}
.roll-btn:hover { transform: scale(1.03); box-shadow: 0 4px 16px rgba(251,191,36,0.3); }
.small-btn {
  background: var(--surface2); border: 1px solid var(--border);
  color: var(--text-dim); padding: 6px 12px; border-radius: 6px;
  font-size: 0.72rem; cursor: pointer; font-weight: 500;
  transition: all 0.12s;
}
.small-btn:hover { color: var(--text); border-color: var(--text-dim); }

/* Player list */
.player-section-label {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-dim); font-weight: 700; margin-bottom: 6px;
}
.player-list-compact {
  display: flex; flex-direction: column; gap: 3px;
  max-height: 400px; overflow-y: auto;
}
.player-btn {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; padding: 7px 10px;
  cursor: pointer; transition: all 0.1s;
  font-size: 0.78rem; text-align: left; color: var(--text);
}
.player-btn:hover { border-color: var(--emerald-border); background: var(--emerald-bg); }
.player-btn.picked { opacity: 0.35; pointer-events: none; }
.player-btn .p-num { color: var(--text-dim); font-size: 0.7rem; min-width: 22px; }
.player-btn .p-name { font-weight: 600; flex: 1; }
.player-btn .p-pos { color: var(--text-dim); font-size: 0.68rem; }
.player-btn .p-rating {
  font-weight: 800; font-size: 0.85rem; color: var(--amber);
  background: var(--amber-bg); border-radius: 4px;
  padding: 2px 7px; min-width: 30px; text-align: center;
}

/* Pitch */
.pitch-container { width: 100%; max-width: 200px; }
.pitch-field {
  background: var(--pitch);
  border-radius: 8px; padding: 12px 8px;
  position: relative; min-height: 380px;
  border: 2px solid var(--pitch-line);
  display: flex; flex-direction: column; align-items: center;
  justify-content: space-around;
}
.pitch-row {
  display: flex; justify-content: space-around; width: 100%;
}
.pitch-slot {
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.85);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.55rem; font-weight: 700; color: #0a5e2e;
  position: relative;
}
.pitch-slot.filled { background: var(--amber); color: #000; }
.pitch-line {
  width: 80%; height: 1px; background: var(--pitch-line);
  margin: 2px 0;
}

/* Box Score */
.box-score {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px;
}
.box-score-title {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-dim); font-weight: 700; margin-bottom: 10px;
}
.score-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 3px 0;
}
.score-row .s-label { font-size: 0.75rem; color: var(--text-dim); }
.score-row .s-val { font-weight: 700; font-size: 1.1rem; color: var(--emerald); }
.score-overall { font-size: 2rem; font-weight: 900; color: var(--emerald); text-align: center; }
.xi-table { width: 100%; margin-top: 10px; border-collapse: collapse; }
.xi-table td {
  padding: 5px 8px; font-size: 0.78rem;
  border-bottom: 1px solid var(--border);
}
.xi-table .xi-pos { color: var(--emerald); font-weight: 700; width: 32px; }
.xi-table .xi-name { font-weight: 600; }
.xi-table .xi-rating { text-align: right; font-weight: 700; color: var(--amber); width: 30px; }
.xi-table .xi-empty { color: var(--text-dim); }

/* Results overlay */
.results-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
}
.results-card {
  background: var(--surface); border-radius: 16px;
  padding: 32px; text-align: center;
  max-width: 420px; width: 90%;
  border: 1px solid var(--border);
}
.results-card .final-score { font-size: 3.5rem; font-weight: 900; color: var(--emerald); }
.results-card .verdict { font-size: 1rem; color: var(--text-dim); margin: 8px 0 16px; }
.results-card .play-again-btn {
  padding: 10px 24px; background: var(--emerald); color: #000;
  border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.9rem;
}
.hidden { display: none !important; }

@media (max-width: 900px) {
  .main-layout { flex-direction: column; }
  .panel-left, .panel-right { width: 100%; min-width: 0; border: none; border-bottom: 1px solid var(--border); }
  .panel-center { order: -1; }
  .pitch-field { min-height: 200px; flex-direction: row; justify-content: space-around; padding: 8px 4px; }
  .pitch-row { flex-direction: column; align-items: center; gap: 2px; }
}
</style>
</head>

var FORMATIONS = {
  "4-3-3":{positions:["GK","RB","CB","CB","LB","CM","CM","CM","RW","ST","LW"],desc:"Classic attacking"},
  "4-4-2":{positions:["GK","RB","CB","CB","LB","RM","CM","CM","LM","ST","ST"],desc:"Two banks of four"},
  "4-2-3-1":{positions:["GK","RB","CB","CB","LB","CDM","CDM","RW","CAM","LW","ST"],desc:"Modern double pivot"},
  "4-2-4":{positions:["GK","RB","CB","CB","LB","CM","CM","RW","ST","ST","LW"],desc:"All-out attack"},
  "3-5-2":{positions:["GK","CB","CB","CB","RM","CM","CDM","CM","LM","ST","ST"],desc:"Wing-back overload"},
  "5-3-2":{positions:["GK","RWB","CB","CB","CB","LWB","CM","CM","CM","ST","ST"],desc:"Defensive block"},
  "4-5-1":{positions:["GK","RB","CB","CB","LB","RM","CM","CAM","CM","LM","ST"],desc:"Midfield control"},
  "3-4-3":{positions:["GK","CB","CB","CB","RM","CM","CM","LM","RW","ST","LW"],desc:"Dutch total football"}
};

// ─── STATE ─────────────────────────────────────────────
var state = {
  formation:"4-3-3", mode:"classic", showRatings:true, ratingMode:"career",
  xi:{}, currentClub:null, currentEra:null, currentPlayers:[],
  rerollsLeft:3, filledCount:0, eraFilter:null
};

// ─── HELPERS ───────────────────────────────────────────
function getRating(p){
  return state.ratingMode==="prime" ? (p.prime||p.rating) : p.rating;
}
function getClubPlayers(club){
  var all = PLAYERS.filter(function(p){return p.club===club;});
  if(state.eraFilter && state.eraFilter!=="All-Time"){
    all = all.filter(function(p){return p.era===state.eraFilter;});
  }
  if(all.length===0) all = PLAYERS.filter(function(p){return p.club===club;});
  return all;
}
function getEmptyPositions(){
  var positions = FORMATIONS[state.formation].positions;
  var counts = {};
  for(var i=0;i<positions.length;i++) counts[positions[i]]=(counts[positions[i]]||0)+1;
  var filled = {};
  var keys = Object.keys(state.xi);
  for(var i=0;i<keys.length;i++){
    var e = state.xi[keys[i]];
    if(e) filled[e.position]=(filled[e.position]||0)+1;
  }
  return positions.filter(function(p,i){
    var sid = p+"_"+i;
    if(state.xi[sid]) return false;
    return true;
  });
}
function getFirstAvailableSlot(pos){
  var positions = FORMATIONS[state.formation].positions;
  for(var i=0;i<positions.length;i++){
    var sid = positions[i]+"_"+i;
    if(positions[i]===pos && !state.xi[sid]) return sid;
  }
  return null;
}
function randomClub(){
  var clubs = Object.keys(CLUBS);
  return clubs[Math.floor(Math.random()*clubs.length)];
}
function randomEra(){
  return ERAS[Math.floor(Math.random()*ERAS.length)];
}
function computeScores(){
  var positions = FORMATIONS[state.formation].positions;
  var att = 0, def = 0, attCount = 0, defCount = 0, total = 0, count = 0;
  var attPos = ["ST","LW","RW","CAM","RM","LM"];
  var defPos = ["GK","CB","RB","LB","RWB","LWB","CDM"];
  for(var i=0;i<positions.length;i++){
    var sid = positions[i]+"_"+i;
    var e = state.xi[sid];
    if(e){
      var r = getRating(e.player);
      total += r; count++;
      if(attPos.indexOf(e.position)>=0){att+=r;attCount++;}
      if(defPos.indexOf(e.position)>=0){def+=r;defCount++;}
    }
  }
  return {
    ovr: count>0 ? Math.round(total/count) : 0,
    att: attCount>0 ? Math.round(att/attCount) : 0,
    def: defCount>0 ? Math.round(def/defCount) : 0
  };
}

// ─── RENDER ────────────────────────────────────────────
function renderAll(){
  renderSettings();
  renderPitch();
  renderBoxScore();
  renderLeft();
  renderHeader();
}
function renderSettings(){
  document.getElementById("form-btns").innerHTML = Object.keys(FORMATIONS).map(function(f){
    return '<button class="setting-btn'+(state.formation===f?' active':'')+'" onclick="setFormation(\''+f+'\')">'+f+'</button>';
  }).join("");
  document.getElementById("mode-btns").innerHTML = [
    {id:"classic",label:"Classic"},
    {id:"memory",label:"From Memory"}
  ].map(function(m){
    return '<button class="setting-btn'+(state.mode===m.id?' active':'')+'" onclick="setMode(\''+m.id+'\')">'+m.label+'</button>';
  }).join("");
  document.getElementById("rating-btns").innerHTML = [
    {id:"career",label:"Career"},
    {id:"prime",label:"Prime"}
  ].map(function(m){
    return '<button class="setting-btn'+(state.ratingMode===m.id?' active':'')+'" onclick="setRatingMode(\''+m.id+'\')">'+m.label+'</button>';
  }).join("");
}
function renderPitch(){
  var positions = FORMATIONS[state.formation].positions;
  var field = document.getElementById("pitch-field");
  // Group by row
  var defPos = ["GK","RB","CB","LB","RWB","LWB"];
  var midPos = ["CM","CDM","CAM","RM","LM"];
  var attPos = ["ST","LW","RW"];
  var rows = [[],[],[]]; // def, mid, att
  for(var i=0;i<positions.length;i++){
    var p = positions[i];
    var sid = p+"_"+i;
    var filled = !!state.xi[sid];
    if(defPos.indexOf(p)>=0) rows[0].push({pos:p,filled:filled});
    else if(midPos.indexOf(p)>=0) rows[1].push({pos:p,filled:filled});
    else rows[2].push({pos:p,filled:filled});
  }
  var html = '<div class="pitch-line"></div>';
  for(var r=0;r<3;r++){
    html += '<div class="pitch-row">';
    for(var j=0;j<rows[r].length;j++){
      html += '<div class="pitch-slot'+(rows[r][j].filled?' filled':'')+'">'+rows[r][j].pos+'</div>';
    }
    html += '</div>';
    if(r<2) html += '<div class="pitch-line"></div>';
  }
  field.innerHTML = html;
}
function renderBoxScore(){
  var scores = computeScores();
  document.getElementById("box-title").textContent = "BOX SCORE · "+state.filledCount+"/11";
  document.getElementById("score-overall").textContent = scores.ovr || "—";
  document.getElementById("score-att").textContent = scores.att || "—";
  document.getElementById("score-def").textContent = scores.def || "—";

  var positions = FORMATIONS[state.formation].positions;
  var html = "";
  for(var i=0;i<positions.length;i++){
    var sid = positions[i]+"_"+i;
    var e = state.xi[sid];
    var r = e ? getRating(e.player) : "";
    var showR = state.mode==="memory" ? "?" : r;
    html += '<tr><td class="xi-pos">'+positions[i]+'</td><td class="xi-name">'+(e?e.player.name:'<span class="xi-empty">—</span>')+'</td><td class="xi-rating">'+showR+'</td></tr>';
  }
  document.getElementById("xi-table").innerHTML = html;
}
function renderLeft(){
  var rollArea = document.getElementById("roll-area");
  var playerLabel = document.getElementById("player-label");
  var playerList = document.getElementById("player-list");

  if(!state.currentClub){
    document.getElementById("drawn-club").classList.add("hidden");
    document.getElementById("roll-btn").classList.remove("hidden");
    document.getElementById("reroll-row").classList.add("hidden");
    playerLabel.classList.add("hidden");
    playerList.innerHTML = "";
  }else{
    document.getElementById("drawn-club").classList.remove("hidden");
    document.getElementById("roll-btn").classList.add("hidden");
    document.getElementById("reroll-row").classList.remove("hidden");
    document.getElementById("club-icon").textContent = CLUBS[state.currentClub].icon;
    document.getElementById("club-name").textContent = state.currentClub;
    document.getElementById("club-era").textContent = state.currentEra ? "Era: "+state.currentEra : "";
    document.getElementById("reroll-count").textContent = state.rerollsLeft;
    playerLabel.classList.remove("hidden");

    var players = state.currentPlayers;
    playerList.innerHTML = players.map(function(p){
      var r = getRating(p);
      var showR = state.mode==="memory" ? "?" : r;
      var picked = false;
      var xiKeys = Object.keys(state.xi);
      for(var i=0;i<xiKeys.length;i++){
        if(state.xi[xiKeys[i]] && state.xi[xiKeys[i]].player.name===p.name){picked=true;break;}
      }
      return '<button class="player-btn'+(picked?' picked':'')+'" onclick="pickPlayer(\''+p.name+'\')">'+
        '<span class="p-num">#'+p.num+'</span>'+
        '<span class="p-name">'+p.name+'</span>'+
        '<span class="p-pos">'+p.pos.join("/")+'</span>'+
        '<span class="p-rating">'+showR+'</span></button>';
    }).join("");
  }
}
function renderHeader(){
  document.getElementById("header-form").textContent = state.formation;
  document.getElementById("header-mode").textContent = state.mode==="classic" ? "Classic" : "From Memory";
  document.getElementById("header-count").textContent = state.filledCount+"/11";
  var scores = computeScores();
  document.getElementById("header-ovr").textContent = scores.ovr || "—";
}

// ─── ACTIONS ───────────────────────────────────────────
function setFormation(f){
  state.formation = f;
  // Reset XI
  state.xi = {}; state.filledCount = 0;
  state.currentClub = null; state.currentEra = null; state.currentPlayers = [];
  renderAll();
}
function setMode(m){
  state.mode = m;
  state.showRatings = m==="classic";
  renderAll();
}
function setRatingMode(m){
  state.ratingMode = m;
  renderAll();
}
function roll(){
  state.currentClub = randomClub();
  state.currentEra = randomEra();
  state.eraFilter = state.currentEra;
  state.currentPlayers = getClubPlayers(state.currentClub);
  state.rerollsLeft = state.mode==="classic" ? 3 : 0;
  renderAll();
}
function rerollClub(){
  if(state.rerollsLeft<=0) return;
  state.rerollsLeft--;
  state.currentClub = randomClub();
  state.currentPlayers = getClubPlayers(state.currentClub);
  renderAll();
}
function pickPlayer(name){
  var player = null;
  for(var i=0;i<state.currentPlayers.length;i++){
    if(state.currentPlayers[i].name===name){player=state.currentPlayers[i];break;}
  }
  if(!player) return;

  // Find first valid empty slot
  var slot = null;
  var positions = FORMATIONS[state.formation].positions;
  for(var j=0;j<player.pos.length;j++){
    var s = getFirstAvailableSlot(player.pos[j]);
    if(s){slot=s;break;}
  }
  if(!slot) return; // No valid slot

  state.xi[slot] = {player:player, position:slot.split("_")[0]};
  state.filledCount++;

  if(state.filledCount >= 11){
    showResults();
  }
  renderAll();
}
function showResults(){
  var scores = computeScores();
  document.getElementById("final-score").textContent = scores.ovr;
  var v = "";
  if(scores.ovr>=90) v="🏆 WORLD CLASS XI — Invincibles worthy!";
  else if(scores.ovr>=87) v="🔥 Elite squad. Title challengers for sure.";
  else if(scores.ovr>=84) v="👍 Solid team. European spots incoming.";
  else if(scores.ovr>=80) v="😐 Mid-table. Decent but not scary.";
  else v="💀 Relegation fodder. Try again!";
  document.getElementById("verdict").textContent = v;

  var positions = FORMATIONS[state.formation].positions;
  var rows = "";
  for(var i=0;i<positions.length;i++){
    var sid = positions[i]+"_"+i;
    var e = state.xi[sid];
    var r = e ? getRating(e.player) : "";
    rows += '<tr><td class="xi-pos">'+positions[i]+'</td><td class="xi-name">'+(e?e.player.name:'—')+'</td><td class="xi-rating">'+r+'</td></tr>';
  }
  document.getElementById("results-xi").innerHTML = rows;
  document.getElementById("results-overlay").classList.remove("hidden");
}
function resetGame(){
  state.xi = {}; state.filledCount = 0;
  state.currentClub = null; state.currentEra = null;
  state.currentPlayers = []; state.eraFilter = null;
  state.rerollsLeft = 3;
  document.getElementById("results-overlay").classList.add("hidden");
  renderAll();
}
function toggleTheme(){
  var html = document.documentElement;
  if(html.classList.contains("dark")){
    html.classList.remove("dark");
    document.getElementById("theme-btn").textContent = "🌙 DARK";
  }else{
    html.classList.add("dark");
    document.getElementById("theme-btn").textContent = "☀ LIGHT";
  }
}

// Init
renderAll();
