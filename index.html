<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>38-0 | Build The Greatest Premier League XI</title>
<style>
:root{--surface:#0a0a0f;--surface2:#111118;--ink:#e2e8f0;--line:#252530;--muted:#94a3b8;--accent:#e8462b;--accent2:#f5b11e;--display:'Georgia',serif;--body:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--numeral:'SF Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--surface);color:var(--ink);font-family:var(--body);min-height:100vh;overflow-x:hidden}
button{font-family:var(--body);cursor:pointer;border:none;background:none;color:inherit;min-height:44px}
/* Header */
.draft-header{display:flex;align-items:center;gap:12px;padding:12px 28px;border-bottom:3px solid var(--ink);max-width:1180px;margin:0 auto;flex-wrap:wrap}
.draft-header .home-link{display:inline-flex;cursor:pointer;text-decoration:none;color:inherit;font-family:var(--display);font-size:22px;font-weight:900;letter-spacing:-0.01em;line-height:0.95}
.draft-header .home-link span{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px}
.dh-info{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}
.dh-info b{color:var(--ink)}
.theme-btn{font-size:12px;padding:8px 14px;border:2px solid var(--ink);border-radius:99px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;transition:background .15s,color .15s}
.theme-btn:hover{background:var(--ink);color:var(--surface)}
/* Layout */
.draft-layout{display:grid;grid-template-columns:minmax(260px,320px) 1fr minmax(200px,280px);max-width:1180px;margin:0 auto;min-height:calc(100vh - 80px)}
.col-roll{border-right:2px solid var(--line);padding:22px;display:flex;flex-direction:column;min-width:0}
.col-pitch{padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-width:0}
.col-box{border-left:2px solid var(--line);padding:22px;display:flex;flex-direction:column;min-width:0}
/* Settings */
.settings{margin-bottom:16px}
.set-label{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;font-weight:800}
.chip-group{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{padding:6px 12px;border:2px solid var(--line);font-size:12px;font-weight:700;border-radius:2px;transition:all .12s;min-height:36px}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* Roll */
.roll-panel{display:flex;flex-direction:column;gap:12px;flex:1;min-height:0;margin-top:8px}
.roll-btn{font-size:24px;padding:14px 20px;background:var(--accent);color:#fff;font-weight:900;width:100%;text-transform:uppercase;letter-spacing:0.04em;border-radius:2px;transition:transform .1s}
.roll-btn:hover{transform:scale(1.02)}
.roll-btn:active{transform:scale(0.98)}
.roll-result{padding:16px 18px;border:2px solid var(--line)}
.rr-sel{font-family:var(--display);font-size:26px;letter-spacing:-0.01em;display:flex;align-items:center;gap:8px}
.rr-year{font-size:18px;color:var(--accent);margin-top:4px}
.rr-spin{opacity:0.5;font-style:italic;font-size:14px}
.reroll-box{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.reroll-label{font-size:12px;color:var(--muted)}
.reroll-btns{display:flex;gap:8px;flex-wrap:wrap}
.reroll-btn{font-size:13px;padding:8px 14px;border:2px solid var(--line);font-weight:700;flex:1;transition:all .12s}
.reroll-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.reroll-btn:disabled{opacity:0.3;cursor:not-allowed}
/* Pool */
.pool-head{display:flex;align-items:center;justify-content:space-between;padding:8px 0 0;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.draft-pool{border:2px solid var(--line);margin-top:8px;max-height:340px;overflow-y:auto;flex:1;min-height:0}
.pool-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border:none;border-bottom:1px solid var(--line);background:var(--surface2);cursor:pointer;transition:all .12s;font-size:14px}
.pool-row:hover{background:var(--accent);color:#fff}
.pool-row.picked{opacity:0.35;pointer-events:none}
.pool-name{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pool-ovr{font-family:var(--numeral);font-size:18px;font-weight:900}
.pool-pos{font-size:10px;color:var(--muted);letter-spacing:0.03em;min-width:28px}
.pool-row:hover .pool-pos,.pool-row:hover .pool-ovr{color:#fff}
/* Pitch */
.pitch-outer{width:100%;max-width:480px}
.pitch-wrap{position:relative;width:100%;aspect-ratio:3/4;background:repeating-linear-gradient(180deg,#1a6e3a 0 7%,#165a2e 7% 14%);border:4px solid rgba(255,255,255,0.3);border-radius:2px}
.pitch-svg{position:absolute;inset:0;width:100%;height:100%}
.pitch-svg line,.pitch-svg circle,.pitch-svg rect{fill:none;stroke:rgba(255,255,255,0.5);stroke-width:2}
.disc{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:default;z-index:2}
.disc .dc{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;background:var(--surface);border:3px solid var(--ink);color:var(--ink)}
.disc .dn{font-size:9px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.7);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.disc.empty .dc{background:transparent;border:3px dashed rgba(255,255,255,0.5);color:rgba(255,255,255,0.6);font-size:12px}
.disc.pickable{cursor:pointer}
.disc.pickable .dc{border-color:var(--accent);background:rgba(232,70,43,0.15);animation:pulse 0.8s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.pitch-hint{margin:10px 0 0;text-align:center;font-size:12px;color:var(--ink);opacity:0.6}
/* Box */
.box-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.box-head .num{font-family:var(--numeral);font-size:36px;line-height:0.9;color:var(--ink)}
.box-ratings{display:flex;gap:14px;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--line)}
.box-rating{display:flex;align-items:baseline;gap:5px;font-weight:800;font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted)}
.box-rating .num{font-size:20px}
.box-rating-atk .num{color:var(--accent)}
.box-rating-def .num{color:var(--ink)}
.boxscore{width:100%}
.boxscore td{padding:6px 4px;font-size:13px}
.boxscore .bs-pos{color:var(--accent);font-weight:700;width:32px}
.boxscore .bs-name{font-weight:700}
.boxscore .bs-ovr{text-align:right;font-family:var(--numeral);font-weight:900}
.sim-btn{margin-top:16px;font-size:20px;padding:14px 20px;background:var(--accent);color:#fff;font-weight:900;width:100%;border-radius:2px;text-transform:uppercase;letter-spacing:0.04em}
.sim-btn:disabled{opacity:0.3;cursor:not-allowed}
.sim-btn:hover:not(:disabled){transform:scale(1.02)}
/* Result overlay */
.result-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;align-items:center;justify-content:center}
.result-overlay.show{display:flex}
.result-card{background:var(--surface);border:3px solid var(--line);padding:40px;text-align:center;max-width:420px;width:90%}
.result-card .final-score{font-size:80px;font-weight:900;line-height:1;font-family:var(--numeral)}
.result-card .win{color:var(--accent)}
.result-card .lose{color:var(--muted)}
.result-card .label{font-size:14px;color:var(--muted);margin:8px 0 20px;text-transform:uppercase;letter-spacing:0.1em}
.result-card .again-btn{font-size:18px;padding:12px 24px;background:var(--accent);color:#fff;font-weight:900;border-radius:2px;width:100%}
/* Responsive */
@media(max-width:900px){
.draft-layout{grid-template-columns:1fr}
.col-roll,.col-pitch{border-right:none;border-bottom:2px solid var(--line)}
.col-box{border-left:none}
}
</style>
</head>

  <!-- RIGHT: Box Score -->
  <div class="col-box">

      <div class="num" id="box-ovr">—</div>

</div>

var CLUBS = ["Arsenal","Aston Villa","Bournemouth","Brentford","Brighton","Chelsea","Crystal Palace","Everton","Fulham","Ipswich Town","Leicester City","Liverpool","Manchester City","Manchester United","Newcastle United","Nottingham Forest","Southampton","Tottenham Hotspur","West Ham United","Wolves"];
var EDITIONS = ["15","16","17","18","19","20"];
var FORMATIONS = {
  "4-3-3": ["GK","RB","CB","CB","LB","CM","CM","CM","RW","ST","LW"],
  "4-4-2": ["GK","RB","CB","CB","LB","RM","CM","CM","LM","ST","ST"],
  "4-2-3-1":["GK","RB","CB","CB","LB","CDM","CDM","CAM","RW","ST","LW"],
  "4-2-4": ["GK","RB","CB","CB","LB","CM","CM","RW","ST","ST","LW"],
  "3-5-2": ["GK","CB","CB","CB","RM","CM","CM","CM","LM","ST","ST"],
  "5-3-2": ["GK","RWB","CB","CB","CB","LWB","CM","CM","CM","ST","ST"],
  "4-5-1": ["GK","RB","CB","CB","LB","RM","CM","CM","LM","CAM","ST"],
  "3-4-3": ["GK","CB","CB","CB","RM","CM","CM","LM","RW","ST","LW"]
};
var PITCH_POS = {
  "GK":[50,92],"RB":[80,75],"CB1":[30,75],"CB2":[50,70],"LB":[20,75],
  "RWB":[85,78],"LWB":[15,78],"CDM1":[35,55],"CDM2":[65,55],
  "CM":[50,50],"CM1":[30,50],"CM2":[50,55],"CM3":[70,50],
  "CAM":[50,38],"RM":[80,52],"LM":[20,52],"RW":[78,25],"ST":[50,18],"ST1":[40,18],"ST2":[60,18],"LW":[22,25],"CB3":[50,65],"CDM":[50,55]
};

// ── STATE ──
var state = {
  formation:"4-3-3", mode:"classic",
  xi:{}, club:null, edition:null, players:[], rerolls:3, activeSlot:null
};

// ── INIT ──
function init(){
  // Formation chips
  var h='';
  for(var f in FORMATIONS){
    h+='<button class="chip'+(f===state.formation?' on':'')+'" onclick="setFormation(\x27'+f+'\x27,this)">'+f+'</button>';
  }
  document.getElementById("formation-chips").innerHTML=h;
  renderPitch();
  updateBox();
}
init();

// ── FORMATION ──
function setFormation(f,btn){
  state.formation=f;
  state.xi={};
  document.querySelectorAll("#formation-chips .chip").forEach(function(c){c.classList.remove("on")});
  btn.classList.add("on");
  renderPitch();
  updateBox();
  updateHeader();
}

// ── MODE ──
function setMode(m,btn){
  state.mode=m;
  document.querySelectorAll(".chip-group:last-of-type .chip").forEach(function(c){c.classList.remove("on")});
  btn.classList.add("on");
}

// ── ROLL ──
function doRoll(){
  state.club = CLUBS[Math.floor(Math.random()*CLUBS.length)];
  state.edition = EDITIONS[Math.floor(Math.random()*EDITIONS.length)];
  state.rerolls = 3;
  filterPlayers();
  renderRoll();
  renderPool();
  renderPitch();
  updateBox();
  updateHeader();
}

function reroll(){
  if(state.rerolls<=0) return;
  state.club = CLUBS[Math.floor(Math.random()*CLUBS.length)];
  state.edition = EDITIONS[Math.floor(Math.random()*EDITIONS.length)];
  state.rerolls--;
  filterPlayers();
  renderRoll();
  renderPool();
  renderPitch();
  updateBox();
  updateHeader();
}

function filterPlayers(){
  state.players = [];
  for(var i=0;i<P.length;i++){
    if(P[i][2]===state.club && P[i][4]===state.edition){
      state.players.push(P[i]);
    }
  }
  // Sort by rating desc
  state.players.sort(function(a,b){return b[3]-a[3]});
}

// ── RENDER ROLL RESULT ──
function renderRoll(){
  var rr=document.getElementById("roll-result");
  var rb=document.getElementById("reroll-box");
  var ph=document.getElementById("pool-head");
  var pl=document.getElementById("pool");
  if(!state.club){
    rr.innerHTML='<div style="border-style:dashed;text-align:center;color:var(--muted);padding:24px">Roll to draw a club and season</div>';
    rb.style.display='none';ph.style.display='none';pl.style.display='none';
    return;
  }
  rr.innerHTML='<div class="rr-sel">⚪ '+state.club+'</div><div class="rr-year">FIFA '+state.edition+'</div><div class="rr-spin">'+state.players.length+' players</div>';
  rb.style.display='';
  document.getElementById("reroll-count").textContent=state.rerolls;
  ph.style.display='';
  pl.style.display='';
}

// ── RENDER POOL ──
function renderPool(){
  var h='';
  for(var i=0;i<state.players.length;i++){
    var p=state.players[i];
    var picked = isPlayerUsed(p);
    h+='<button class="pool-row'+(picked?' picked':'')+'" onclick="'+(picked?'':'pickPlayer('+i+')')+'">';
    h+='<span class="pool-pos">'+p[1]+'</span>';
    h+='<span class="pool-name">'+p[0]+'</span>';
    if(state.mode==='classic') h+='<span class="pool-ovr">'+p[3]+'</span>';
    else h+='<span class="pool-ovr">?</span>';
    h+='</button>';
  }
  document.getElementById("pool").innerHTML=h||'<div style="padding:16px;color:var(--muted);text-align:center">No players for this club + season</div>';
}

function isPlayerUsed(p){
  var slots=FORMATIONS[state.formation];
  for(var s in state.xi){
    var x=state.xi[s];
    if(x && x[0]===p[0] && x[2]===p[2] && x[4]===p[4]) return true;
  }
  return false;
}

// ── PICK PLAYER ──
function pickPlayer(idx){
  var p=state.players[idx];
  var slots=FORMATIONS[state.formation];
  // Auto-assign to first empty matching slot
  var assigned=false;
  for(var i=0;i<slots.length;i++){
    if(!state.xi[i] && posMatch(p[1],slots[i])){
      state.xi[i]=p;
      assigned=true;
      break;
    }
  }
  if(!assigned){
    // Fill first empty slot
    for(var i=0;i<slots.length;i++){
      if(!state.xi[i]){state.xi[i]=p;break;}
    }
  }
  renderPool();
  renderPitch();
  updateBox();
  updateHeader();
}

function posMatch(ppos,slot){
  if(ppos===slot) return true;
  if(ppos==="CB" && (slot==="CB1"||slot==="CB2")) return true;
  if((ppos==="CM"||ppos==="CAM") && (slot==="CM"||slot==="CM1"||slot==="CM2"||slot==="CM3"||slot==="CAM")) return true;
  if(ppos==="CDM" && (slot==="CDM1"||slot==="CDM2"||slot==="CDM"||slot==="CM")) return true;
  if(ppos==="FB" && (slot==="RB"||slot==="LB")) return true;
  if(ppos==="RB" && (slot==="RB"||slot==="RWB")) return true;
  if(ppos==="LB" && (slot==="LB"||slot==="LWB")) return true;
  if((ppos==="RM"||ppos==="RW") && (slot==="RW"||slot==="RM")) return true;
  if((ppos==="LM"||ppos==="LW") && (slot==="LW"||slot==="LM")) return true;
  if((ppos==="ST"||ppos==="CF") && (slot==="ST"||slot==="CF")) return true;
  return false;
}

function removePlayer(slotIdx){
  delete state.xi[slotIdx];
  renderPool();
  renderPitch();
  updateBox();
  updateHeader();
}

// ── RENDER PITCH ──
function renderPitch(){
  var slots=FORMATIONS[state.formation];
  var cnt={};
  for(var j=0;j<slots.length;j++){cnt[slots[j]]=(cnt[slots[j]]||0)+1;}
  var seen={};
  var h='';
  for(var i=0;i<slots.length;i++){
    var s=slots[i];
    seen[s]=(seen[s]||0)+1;
    var posKey=cnt[s]>1?s+seen[s]:s;
    var coords=PITCH_POS[posKey]||PITCH_POS[s]||[50,50];
    var p=state.xi[i];
    var cls=p?'':' empty'+(state.club?' pickable':'');
    h+='<div class="disc'+cls+'" style="left:'+coords[0]+'%;top:'+coords[1]+'%"'+
      (p?'':' onclick="slotClicked('+i+')"')+'>';
    if(p){
      var ovr = state.mode==='classic'||p[3]>=80 ? p[3] : '?';
      h+='<div class="dc" onclick="removePlayer('+i+')" title="Click to remove">'+ovr+'</div>';
      h+='<div class="dn">'+p[0]+'</div>';
    } else {
      h+='<div class="dc">'+s.replace(/[0-9]/g,'')+'</div>';
      h+='<div class="dn">—</div>';
    }
    h+='</div>';
  }
  document.getElementById("discs").innerHTML=h;
  document.getElementById("pitch-hint").textContent=state.club?'Tap a player to pick · tap disc to remove':'';
}

function slotClicked(i){
  // For auto-assign mode, just pick the best available player for this slot
  var slots=FORMATIONS[state.formation];
  var target=slots[i];
  for(var j=0;j<state.players.length;j++){
    var p=state.players[j];
    if(!isPlayerUsed(p) && (posMatch(p[1],target) || target.startsWith(p[1]))){
      pickPlayer(j);
      return;
    }
  }
  // Fallback: pick first available
  for(var j=0;j<state.players.length;j++){
    if(!isPlayerUsed(state.players[j])){pickPlayer(j);return;}
  }
}

// ── UPDATE BOX SCORE ──
function updateBox(){
  var slots=FORMATIONS[state.formation];
  var filled=0,atk=0,def=0,total=0;
  for(var i=0;i<slots.length;i++){
    if(state.xi[i]){
      filled++;
      var r=state.xi[i][3];
      total+=r;
      if(slots[i]==="ST"||slots[i]==="RW"||slots[i]==="LW"||slots[i]==="CAM"||slots[i]==="CF") atk+=r;
      else if(slots[i]==="GK"||slots[i].startsWith("CB")||slots[i].startsWith("L")||slots[i].startsWith("R")) def+=r;
      else {atk+=r*0.5;def+=r*0.5;}
    }
  }
  var ovr=filled>0?Math.round(total/filled):null;
  document.getElementById("box-ovr").textContent=ovr||"—";
  document.getElementById("box-count").textContent=filled;
  document.getElementById("box-atk").textContent=filled>0?Math.round(atk/Math.max(1,filled)):"—";
  document.getElementById("box-def").textContent=filled>0?Math.round(def/Math.max(1,filled)):"—";

  // Box score table
  var h='';
  for(var i=0;i<slots.length;i++){
    var p=state.xi[i];
    h+='<tr><td class="bs-pos">'+slots[i].replace(/[0-9]/g,'')+'</td>';
    h+='<td class="bs-name">'+(p?p[0]:'—')+'</td>';
    h+='<td class="bs-ovr">'+(p?(state.mode==='classic'?p[3]:'?'):'')+'</td></tr>';
  }
  document.getElementById("boxscore").innerHTML=h;

  var sb=document.getElementById("sim-btn");
  sb.disabled=filled<11;
  sb.textContent=filled===11?'SIMULATE THE SEASON 🔒':'BUILD · '+(11-filled)+' LEFT';
}

// ── UPDATE HEADER ──
function updateHeader(){
  var info=state.formation+' · '+state.mode.toUpperCase();
  if(state.club) info=' · '+state.club+' · FIFA '+state.edition;
  document.getElementById("dh-info").innerHTML='<b>'+state.formation+'</b> · '+state.mode.toUpperCase()+
    (state.club?' · '+state.club+' · FIFA '+state.edition:'');
}

// ── SIMULATE ──
function simulate(){
  var slots=FORMATIONS[state.formation];
  var filled=0;
  for(var i=0;i<slots.length;i++){if(state.xi[i])filled++;}
  if(filled<11) return;

  // Score based on average rating vs random opponent
  var total=0;
  for(var i=0;i<slots.length;i++){total+=state.xi[i][3];}
  var avg=total/filled;

  // Simulate a result: higher avg = more likely to win big
  var ourScore=0,theirScore=0;
  var atk=0;for(var i=0;i<slots.length;i++){if(slots[i]==="ST"||slots[i]==="RW"||slots[i]==="LW")atk+=state.xi[i][3];}
  var def=0;for(var i=0;i<slots.length;i++){if(slots[i]==="GK"||slots[i].startsWith("CB"))def+=state.xi[i][3];}

  var atkPct=atk/(atk+def);
  var oppAvg=70+Math.random()*20;

  // Generate score
  var diff=avg-oppAvg;
  var base=Math.max(0,Math.round(diff/10+Math.random()*3));
  theirScore=Math.max(0,Math.round(Math.random()*3-(diff>10?2:0)));
  ourScore=Math.max(0,base+Math.round(Math.random()*3));

  var won=ourScore>theirScore;

  var card=document.getElementById("overlay-card");
  var wl=won?'win':'lose';
  var emoji=won?' 🏆':'';
  card.innerHTML='<div class="final-score '+wl+'">'+ourScore+'-'+theirScore+'</div>'+
    '<div class="label">'+state.club+' · FIFA '+state.edition+'</div>'+
    '<div style="font-size:24px;margin:12px 0">'+(won?'CHAMPIONS'+emoji:'ELIMINATED')+'</div>'+
    '<div style="color:var(--muted);margin:8px 0 20px">Overall: '+Math.round(avg)+'</div>'+
    '<button class="again-btn" onclick="resetGame()">PLAY AGAIN</button>';
  document.getElementById("overlay").classList.add("show");
}

function resetGame(){
  state.club=null;state.edition=null;state.xi={};state.players=[];
  document.getElementById("overlay").classList.remove("show");
  renderRoll();
  renderPool();
  renderPitch();
  updateBox();
  updateHeader();
}

// ── THEME ──
function toggleTheme(){
  var h=document.documentElement;
  if(h.classList.contains("dark")){
    h.classList.remove("dark");
    h.style.setProperty("--surface","#f8f9fa");
    h.style.setProperty("--surface2","#fff");
    h.style.setProperty("--ink","#212529");
    h.style.setProperty("--line","#dee2e6");
    h.style.setProperty("--muted","#6c757d");
    document.getElementById("theme-btn").textContent="☾ DARK";
  } else {
    h.classList.add("dark");
    h.style.setProperty("--surface","#0a0a0f");
    h.style.setProperty("--surface2","#111118");
    h.style.setProperty("--ink","#e2e8f0");
    h.style.setProperty("--line","#252530");
    h.style.setProperty("--muted","#94a3b8");
    document.getElementById("theme-btn").textContent="☀ LIGHT";
  }
}
